<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b6fa8">
<title>Замер обрамлений ДШ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#edf1f5;--surface:#fff;--soft:#f2f5f8;--line:#d5dde5;--ink:#15212c;--muted:#586775;--accent:#1b6fa8;--accent-ink:#fff;--ok:#2c8a57;--bad:#c0392b;--shadow:rgba(21,33,44,.14)}
@media (prefers-color-scheme:dark){:root{--bg:#0e151c;--surface:#17212b;--soft:#1f2b37;--line:#2e3c4a;--ink:#e7eef4;--muted:#93a3b2;--accent:#5caae8;--accent-ink:#0b1620;--ok:#4cc08a;--bad:#ff7b6b;--shadow:rgba(0,0,0,.5);color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:max(10px,env(safe-area-inset-top)) 16px 8px;display:grid;gap:8px}
.bar{display:flex;align-items:center;gap:6px;min-height:44px}
.bar h1{margin:0;font-size:17px;font-weight:600;flex:1;line-height:1.2}
.ib{width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer}
.ib:active{background:var(--soft)} .ib svg{width:22px;height:22px}
.prog{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
main{flex:1;padding:8px 16px 16px;display:grid;grid-template-columns:minmax(0,1fr);align-content:start;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;box-shadow:0 8px 24px -16px var(--shadow)}
.q{font-size:21px;line-height:1.25;font-weight:600;margin:0;text-wrap:balance}
.hint{margin:0;color:var(--muted);font-size:14px}
.chip{display:inline-block;font-size:12px;font-weight:600;background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:3px 10px;color:var(--muted);width:fit-content}
.field{display:flex;align-items:center;border:1.5px solid var(--line);background:var(--soft);border-radius:14px;padding:0 14px;min-height:56px}
.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent)}
.field input,.field textarea{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:20px;padding:12px 0;outline:0;resize:none}
.field textarea{font-size:18px;min-height:90px}
.field .u{color:var(--muted);font-weight:600;margin-left:8px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:-4px 0 0}
.choices{display:grid;gap:10px}
.choice{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;text-align:left;border-radius:14px;padding:14px 16px;min-height:56px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px}
.choice:active,.choice.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.choice.on::after{content:"✓";color:var(--accent)}
.schemes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sch{border:2px solid var(--line);background:#fff;border-radius:14px;padding:6px;cursor:pointer;display:grid;gap:4px;font:inherit;color:#15212c;font-weight:600;text-align:center}
.sch img{width:100%;height:auto;display:block}
.sch.on{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sw button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:6px 4px 8px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;display:grid;gap:5px;justify-items:center}
.sw button i{width:100%;height:26px;border-radius:7px;border:1px solid rgba(0,0,0,.15);display:block}
.sw button.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
footer.act{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 24%);padding:18px 16px max(14px,env(safe-area-inset-bottom));display:grid;gap:8px}
.btn{border:0;border-radius:14px;min-height:54px;font:inherit;font-weight:600;font-size:17px;cursor:pointer;background:var(--accent);color:var(--accent-ink);padding:0 18px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.sec{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost{background:transparent;color:var(--accent);min-height:44px;font-size:15px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5}
button:focus-visible,.field:focus-within{outline-offset:2px}
button:focus-visible{outline:3px solid var(--accent)}
.sec-card{display:grid;gap:8px}
.sec-card h3{margin:0;font-size:16px}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--soft);border-radius:10px;padding:8px 10px;font-size:14px}
.item button{border:0;background:transparent;color:var(--bad);font-size:20px;width:36px;height:36px;border-radius:8px;cursor:pointer}
.sum{display:grid;gap:4px;font-size:14px}
.sum b{font-weight:600}
.pages{display:grid;gap:12px}
.pages img{width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff;display:block}
.hero{text-align:center;display:grid;gap:10px;justify-items:center;padding:30px 10px 6px}
.hero img{width:92px;height:92px;border-radius:22px}
.hero h2{margin:0;font-size:26px;line-height:1.15}
.hero p{margin:0;color:var(--muted)}
.ok{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--ok);color:#fff;font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:20}
.hello{display:flex;align-items:center;gap:14px}
.hello img{width:60px;height:60px;border-radius:16px;box-shadow:0 8px 20px -10px var(--shadow)}
.hello h2{margin:0;font-size:24px;line-height:1.15}
.hello p{margin:2px 0 0;color:var(--muted);font-size:15px}
.tiles{display:grid;gap:12px}
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:16px;font:inherit;cursor:pointer;box-shadow:0 8px 24px -16px var(--shadow);position:relative}
.tile:active{transform:scale(.99)}
.tile .ti{width:52px;height:52px;border-radius:15px;background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent);display:grid;place-items:center;flex:none}
.tile .ti svg{width:28px;height:28px}
.tile .tt{display:grid;gap:2px;flex:1;min-width:0}
.tile .tt b{font-size:17px;font-weight:600}
.tile .tt small{color:var(--muted);font-size:13.5px;line-height:1.3}
.tile .go{font-size:28px;color:var(--accent);line-height:1}
.tile em{font-style:normal;font-size:11.5px;font-weight:600;color:var(--muted);background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:3px 9px;white-space:nowrap}
.tile.soon .ti{background:var(--soft);color:var(--muted)}
.tile.soon .tt b{color:var(--muted)}
.tile.cont{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.tips{padding:14px 16px}
.credit{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.5;margin:6px 0 0;letter-spacing:.02em}
.credit b{display:inline-block;color:var(--ink);font-size:15px;font-weight:600;letter-spacing:0;margin-top:2px}
.soonico{width:72px;height:72px;border-radius:20px;background:var(--soft);color:var(--muted);display:grid;place-items:center}
.soonico svg{width:38px;height:38px}
.doorsvg{width:min(240px,70%);justify-self:center;color:var(--ink);display:block;margin:0 auto}
.doorsvg .flo{font-size:11px;fill:var(--muted)}
.cas{cursor:pointer;outline:none}
.cas rect{fill:color-mix(in srgb,var(--accent) 6%,transparent);stroke:#8a98a6;stroke-width:2;stroke-dasharray:5 4}
.cas text{font:700 18px system-ui,sans-serif;fill:#8a98a6;pointer-events:none;dominant-baseline:middle}
.cas.on rect{fill:#fde3bd;stroke:#c9801a;stroke-dasharray:none}
.cas.on text{fill:#8a5200}
.cas:focus-visible rect{stroke:var(--accent);stroke-width:3}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="pdf.js"></script>
<script src="app.js"></script>
</body>
</html>
